{% load i18n %}
<section class="band band-tint" id="how" data-band>
  <div class="wrap">
    <div class="band-head">
      <p class="eyebrow">{% translate "How it works" %}</p>
      <h2>{% translate "Three steps, and a person at the end of them." %}</h2>
    </div>

    <div class="stepper">
      {# Without JS all three render as a plain list, all marked current. #}
      <ol class="steps">
        <li>
          <button type="button" class="step" aria-current="true">
            <span class="step-n">1</span>
            <span>
              <strong>{% translate "You describe them." %}</strong>
              <span>{% blocktranslate %}What they were wearing, scars or tattoos, and where they were last seen.{% endblocktranslate %}</span>
            </span>
          </button>
        </li>
        <li>
          <button type="button" class="step" aria-current="false">
            <span class="step-n">2</span>
            <span>
              <strong>{% translate "Facilities describe who they have received." %}</strong>
              <span>{% blocktranslate %}Hospitals, morgues and police posts record the same details for people not yet identified.{% endblocktranslate %}</span>
            </span>
          </button>
        </li>
        <li>
          <button type="button" class="step" aria-current="false">
            <span class="step-n">3</span>
            <span>
              <strong>{% translate "An official compares the two and contacts you." %}</strong>
              <span>{% blocktranslate %}Every possible match is checked by a trained person before anyone is told anything.{% endblocktranslate %}</span>
            </span>
          </button>
        </li>
      </ol>

      <div class="steps-figure" aria-hidden="true">
        <svg viewBox="0 0 360 260">
          <g data-step-state="0">
            <circle class="node" cx="60" cy="60" r="7"/>
            <circle class="node" cx="60" cy="110" r="7"/>
            <circle class="node" cx="60" cy="160" r="7"/>
            <circle class="node" cx="60" cy="210" r="7"/>
          </g>
          <g data-step-state="1">
            <circle class="node" cx="300" cy="60" r="7"/>
            <circle class="node" cx="300" cy="110" r="7"/>
            <circle class="node" cx="300" cy="160" r="7"/>
            <circle class="node" cx="300" cy="210" r="7"/>
          </g>
          <g data-step-state="2">
            <path class="link" d="M60 60 C 150 60, 150 130, 180 130"/>
            <path class="link" d="M60 110 C 150 110, 150 130, 180 130"/>
            <path class="link" d="M60 160 C 150 160, 150 130, 180 130"/>
            <path class="link" d="M60 210 C 150 210, 150 130, 180 130"/>
            <path class="link" d="M300 60 C 210 60, 210 130, 180 130"/>
            <path class="link" d="M300 110 C 210 110, 210 130, 180 130"/>
            <path class="link" d="M300 160 C 210 160, 210 130, 180 130"/>
            <path class="link" d="M300 210 C 210 210, 210 130, 180 130"/>
            <circle class="node" cx="180" cy="130" r="10"/>
          </g>
        </svg>
      </div>
    </div>
  </div>
</section>
